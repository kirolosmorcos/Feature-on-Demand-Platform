version: "3.8"

services:

  nginx:

    image: nginx:latest

    ports:
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs

    depends_on:
      - hmi_websocket


  hmi_websocket:

    build: .

    environment:
      # BACKEND_SERVER_URL: http://ota-web-app.azurewebsites.net/api
      BACKEND_SERVER_URL: http://host.docker.internal:5000/api

      VM_EMAIL: websocket_vm@system.local
      VM_PASSWORD: password123

    expose:
      - "8000"

    ports:
      - "5679:5678"

    volumes:
      - .:/app

    command: ["sh","-c","pip install debugpy -t /tmp && python -Xfrozen_modules=off /tmp/debugpy  --listen 0.0.0.0:5678   -m uvicorn main:app  --reload --host 0.0.0.0 --port 8000  --reload-dir /app"]        