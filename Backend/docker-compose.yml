version: "3.8"
services:

  frontend:
    image: kiro35morcos/ota-frontend:latest
    ports:
      - "80:80"

  backend:
    image: kiro35morcos/ota-backend:latest
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in your environment}
      MONGO_DB: ota_db_jessy_new
      HEX_STORAGE_ACCOUNT_NAME: otafirmwarestore
      HEX_STORAGE_CONTAINER_NAME: hexfiles
      HEX_STORAGE_ACCOUNT_KEY: ${HEX_STORAGE_ACCOUNT_KEY:?Set HEX_STORAGE_ACCOUNT_KEY in your environment}
      IOTHUB_CONNECTION_STRING: ${IOTHUB_CONNECTION_STRING:?Set IOTHUB_CONNECTION_STRING in your environment}
      SERVICE_BUS_CONNECTION: ${SERVICE_BUS_CONNECTION:?Set SERVICE_BUS_CONNECTION in your environment}
      BUS_QUEUE_NAME: license-expiration-queue
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in your environment}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH:-/app/private.pem}
      ISSUER_ID: 2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your environment}
    ports:
      - "5000:80"
